[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "setuper"
version = "0.1.0"
description = "Capture and restore reproducible work setups."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.14",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.urls]
Documentation = "https://github.com/gkxvall/Setuper#readme"
Issues = "https://github.com/gkxvall/Setuper/issues"
Repository = "https://github.com/gkxvall/Setuper"

[tool.hatch.build.targets.wheel]
packages = ["src/setuper"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["setuper"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
